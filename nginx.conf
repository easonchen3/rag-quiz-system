# RAG Quiz System - Nginx 配置
# 部署路径: /opt/rag-quiz

server {
    listen 80;
    server_name _;

    charset utf-8;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # API 代理到后端
    location /rag-quiz/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # 前端静态文件 + SPA 路由
    location /rag-quiz/ {
        alias /opt/rag-quiz/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /rag-quiz/index.html;
    }

    # 静态资源缓存
    location /rag-quiz/assets/ {
        alias /opt/rag-quiz/frontend/dist/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    error_log /var/log/nginx/rag-quiz-error.log;
    access_log /var/log/nginx/rag-quiz-access.log;
}
